<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>emarkan Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAxmfQgQOpscxyTPlHzbcivO3qX5uuopRU",
    authDomain: "emarkan-54637.firebaseapp.com",
    projectId: "emarkan-54637",
    storageBucket: "emarkan-54637.firebasestorage.app",
    messagingSenderId: "32942305532",
    appId: "1:32942305532:web:b1bc504170bdb03a0b6779"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  window._fb = { auth, db, signInWithEmailAndPassword, signOut, onAuthStateChanged, collection, getDocs, query, orderBy };
</script>
<style>
:root{
  --cream:#F7F3ED;--cream2:#EFEBE3;--ink:#1A1714;--ink2:#3D3A35;--ink3:#7A756E;
  --warm:#C4956A;--warm2:#A87548;--warm-l:#F0E4D4;
  --teal:#2D6A5A;--teal-l:#E3EDE9;
  --border:#DDD8CF;--white:#FFFFFF;--red:#C0392B;
  --shadow:0 1px 4px rgba(26,23,20,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream2);color:var(--ink);font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* LOGIN */
#v-login{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.login-box{background:var(--white);border:1px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:360px}
.logo{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;color:var(--ink);text-align:center;margin-bottom:4px}
.logo span{color:var(--warm2)}
.logo-sub{text-align:center;font-size:12px;color:var(--ink3);margin-bottom:28px;background:var(--warm-l);padding:4px 12px;border-radius:20px;display:inline-block;width:100%}
.fl{margin-bottom:14px}
.fl label{display:block;font-size:11px;font-weight:500;color:var(--ink3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
.fl input{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-family:inherit;font-size:14px;outline:none;transition:border-color .15s}
.fl input:focus{border-color:var(--warm)}
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;background:var(--ink);color:var(--white)}
.btn:disabled{opacity:.5}
.err{font-size:12px;color:var(--red);margin:-8px 0 10px;text-align:center}

/* ADMIN */
#v-admin{display:none}
.topbar{background:var(--ink);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-logo{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;color:#fff}
.topbar-logo span{color:var(--warm)}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-user{font-size:12px;color:rgba(255,255,255,.5)}
.logout-btn{background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.7);padding:6px 14px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:12px}
.logout-btn:hover{background:rgba(255,255,255,.2)}
.content{max-width:1200px;margin:0 auto;padding:24px 20px}
.page-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:600;color:var(--ink);margin-bottom:6px}
.page-sub{font-size:13px;color:var(--ink3);margin-bottom:24px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:28px}
.stat-card{background:var(--white);border-radius:14px;padding:18px;box-shadow:var(--shadow);border-top:3px solid var(--border)}
.stat-card.green{border-top-color:#27AE60}
.stat-card.teal{border-top-color:var(--teal)}
.stat-card.warm{border-top-color:var(--warm)}
.stat-label{font-size:11px;color:var(--ink3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.stat-val{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;color:var(--ink);line-height:1}
.stat-val.green{color:#27AE60}
.stat-val.teal{color:var(--teal)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.card{background:var(--white);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.card-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.card-title span{font-size:11px;color:var(--ink3);font-weight:400}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.row:last-child{border-bottom:none}
.row-label{color:var(--ink2)}
.row-val{font-weight:600;color:var(--teal)}
.row-val.green{color:#27AE60}
.row-val.warm{color:var(--warm2)}
.rank{font-size:11px;font-weight:700;color:var(--ink3);width:18px;flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;color:var(--ink3);font-weight:500;border-bottom:2px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td{padding:10px;color:var(--ink2);border-bottom:1px solid var(--border)}
td:first-child{font-weight:500;color:var(--ink)}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.badge-marka{background:var(--warm-l);color:var(--warm2)}
.badge-uretici{background:var(--teal-l);color:var(--teal)}
.refresh-btn{background:var(--ink);color:#fff;border:none;padding:9px 20px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:13px;display:flex;align-items:center;gap:6px}
.refresh-btn:hover{opacity:.85}
.empty-row{text-align:center;padding:20px;color:var(--ink3)}
.loading{text-align:center;padding:60px;color:var(--ink3)}
.spin{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--warm);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}

@media(max-width:768px){
  .grid-2,.grid-3{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .content{padding:16px}
  table{font-size:12px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="v-login">
  <div class="login-box">
    <div class="logo">emarkan<span>.</span></div>
    <div class="logo-sub">Yönetici Paneli</div>
    <div class="fl"><label>Email</label><input id="email" type="email" placeholder="admin@firma.com" autocomplete="email"></div>
    <div class="fl"><label>Şifre</label><input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="err" id="err"></div>
    <button class="btn" id="login-btn" onclick="doLogin()">Giriş Yap</button>
  </div>
</div>

<!-- ADMIN -->
<div id="v-admin">
  <div class="topbar">
    <div class="topbar-logo">emarkan<span>.</span> <span style="color:rgba(255,255,255,.4);font-size:13px;font-family:'DM Sans',sans-serif;font-weight:400">Admin</span></div>
    <div class="topbar-right">
      <span class="topbar-user" id="admin-user"></span>
      <button class="logout-btn" onclick="doLogout()">Çıkış</button>
    </div>
  </div>
  <div class="content">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:12px">
      <div>
        <div class="page-title">Dashboard</div>
        <div class="page-sub" id="last-updated">Yükleniyor...</div>
      </div>
      <button class="refresh-btn" onclick="loadData()"><span class="spin" id="refresh-spin" style="display:none"></span>↻ Yenile</button>
    </div>
    <div id="dashboard"></div>
  </div>
</div>

<script>
const ADMIN_EMAIL = 'bircan@cambeltekstil.com';
const HIZMET_LABELS = {
  'uretici':'Üretici','etiket':'Etiket & Ambalajcı','kalipci':'Kalıpçı',
  'tasarimci':'Tasarımcı','kumasci':'Kumaşçı','aksesuarci':'Aksesuarcı','diger':'Diğer','marka':'Marka'
};
function hl(tip){return HIZMET_LABELS[tip]||tip||'Bilinmiyor'}
function fmt(n){return'₺'+(n||0).toLocaleString('tr-TR')}
function fmtD(ts){if(!ts)return'—';const d=ts.toDate?ts.toDate():new Date(ts.seconds*1000);return d.toLocaleDateString('tr-TR')}
function getFB(){return window._fb}

async function doLogin(){
  const fb=getFB();
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  const err=document.getElementById('err');
  const btn=document.getElementById('login-btn');
  err.textContent='';
  if(!email||!pass){err.textContent='Email ve şifre zorunlu';return;}
  if(email!==ADMIN_EMAIL){err.textContent='Bu panele erişim yetkiniz yok';return;}
  btn.disabled=true;btn.textContent='Giriş yapılıyor...';
  try{
    await fb.signInWithEmailAndPassword(fb.auth,email,pass);
  }catch(e){
    err.textContent='Email veya şifre hatalı';
    btn.disabled=false;btn.textContent='Giriş Yap';
  }
}

async function doLogout(){
  const fb=getFB();
  await fb.signOut(fb.auth);
  document.getElementById('v-login').style.display='flex';
  document.getElementById('v-admin').style.display='none';
  document.getElementById('email').value='';
  document.getElementById('pass').value='';
}

async function loadData(){
  const fb=getFB();
  const el=document.getElementById('dashboard');
  const spin=document.getElementById('refresh-spin');
  spin.style.display='inline-block';
  document.getElementById('last-updated').textContent='Güncelleniyor...';

  try{
    const [profilesSnap,taleplerSnap,tekliflerSnap,siparislerSnap]=await Promise.all([
      fb.getDocs(fb.collection(fb.db,'profiles')),
      fb.getDocs(fb.collection(fb.db,'talepler')),
      fb.getDocs(fb.collection(fb.db,'teklifler')),
      fb.getDocs(fb.collection(fb.db,'siparisler'))
    ]);

    const profiles=profilesSnap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.email!==ADMIN_EMAIL);
    const talepler=taleplerSnap.docs.map(d=>({id:d.id,...d.data()}));
    const teklifler=tekliflerSnap.docs.map(d=>({id:d.id,...d.data()}));
    const siparisler=siparislerSnap.docs.map(d=>({id:d.id,...d.data()}));

    const markalar=profiles.filter(p=>p.role==='marka');
    const hizmetVerenler=profiles.filter(p=>p.role==='uretici');
    const platformCiro=teklifler.reduce((a,t)=>a+(t.fee||0),0);
    const siparisCiro=siparisler.reduce((a,s)=>a+(s.tutar||0),0);

    // Hizmet tipi dağılımı
    const hizmetTip={};
    hizmetVerenler.forEach(p=>{const t=p.hizmet_tipi||'uretici';hizmetTip[t]=(hizmetTip[t]||0)+1;});

    // Kategori dağılımı
    const katDagilim={};
    talepler.forEach(t=>{if(t.kategori)katDagilim[t.kategori]=(katDagilim[t.kategori]||0)+1;});

    // En çok teklif veren
    const teklifSayisi={};
    teklifler.forEach(t=>{teklifSayisi[t.user_id]=(teklifSayisi[t.user_id]||0)+1;});
    const topTeklif=Object.entries(teklifSayisi).sort((a,b)=>b[1]-a[1]).slice(0,5)
      .map(([uid,sayi])=>{const p=hizmetVerenler.find(x=>x.id===uid);return{ad:p?.firma_adi||p?.name||uid,sayi};});

    // En çok platform geliri getiren
    const ureticiGelir={};
    teklifler.forEach(t=>{ureticiGelir[t.user_id]=(ureticiGelir[t.user_id]||0)+(t.fee||0);});
    const topGelir=Object.entries(ureticiGelir).sort((a,b)=>b[1]-a[1]).slice(0,5)
      .map(([uid,gelir])=>{const p=hizmetVerenler.find(x=>x.id===uid);return{ad:p?.firma_adi||p?.name||uid,gelir};});

    // Son kayıtlar
    const sonKayitlar=[...profiles]
      .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,10);

    el.innerHTML=`
    <div class="stats-grid">
      <div class="stat-card warm"><div class="stat-label">Toplam Marka</div><div class="stat-val warm">${markalar.length}</div></div>
      <div class="stat-card teal"><div class="stat-label">Hizmet Veren</div><div class="stat-val teal">${hizmetVerenler.length}</div></div>
      <div class="stat-card"><div class="stat-label">Toplam Talep</div><div class="stat-val">${talepler.length}</div></div>
      <div class="stat-card"><div class="stat-label">Toplam Teklif</div><div class="stat-val">${teklifler.length}</div></div>
      <div class="stat-card green"><div class="stat-label">Platform Cirosu</div><div class="stat-val green">${fmt(platformCiro)}</div></div>
      <div class="stat-card"><div class="stat-label">Sipariş Cirosu</div><div class="stat-val">${fmt(siparisCiro)}</div></div>
    </div>

    <div class="grid-3">
      <div class="card">
        <div class="card-title">Hizmet Veren Tipleri <span>${hizmetVerenler.length} toplam</span></div>
        ${Object.entries(hizmetTip).sort((a,b)=>b[1]-a[1]).map(([tip,sayi])=>`
        <div class="row"><span class="row-label">${hl(tip)}</span><span class="row-val">${sayi}</span></div>`).join('')
        ||'<div class="empty-row">Henüz kayıt yok</div>'}
      </div>
      <div class="card">
        <div class="card-title">Talep Kategorileri <span>${talepler.length} toplam</span></div>
        ${Object.entries(katDagilim).sort((a,b)=>b[1]-a[1]).map(([kat,sayi])=>`
        <div class="row"><span class="row-label">${kat}</span><span class="row-val warm">${sayi}</span></div>`).join('')
        ||'<div class="empty-row">Henüz talep yok</div>'}
      </div>
      <div class="card">
        <div class="card-title">Talep Durumları</div>
        ${['open','offered','accepted','production','shipped','delivered'].map(s=>{
          const sayi=talepler.filter(t=>t.status===s).length;
          const label={open:'Bekliyor',offered:'Teklif alındı',accepted:'Onaylandı',production:'Üretimde',shipped:'Kargoda',delivered:'Teslim'}[s];
          return sayi>0?`<div class="row"><span class="row-label">${label}</span><span class="row-val">${sayi}</span></div>`:'';
        }).join('')||'<div class="empty-row">Henüz talep yok</div>'}
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-title">En Çok Teklif Veren <span>Top 5</span></div>
        ${topTeklif.map((u,i)=>`
        <div class="row">
          <div style="display:flex;align-items:center;gap:8px"><span class="rank">${i+1}</span><span class="row-label">${u.ad}</span></div>
          <span class="row-val teal">${u.sayi} teklif</span>
        </div>`).join('')||'<div class="empty-row">Henüz teklif yok</div>'}
      </div>
      <div class="card">
        <div class="card-title">En Çok Gelir Getiren <span>Top 5</span></div>
        ${topGelir.map((u,i)=>`
        <div class="row">
          <div style="display:flex;align-items:center;gap:8px"><span class="rank">${i+1}</span><span class="row-label">${u.ad}</span></div>
          <span class="row-val green">${fmt(u.gelir)}</span>
        </div>`).join('')||'<div class="empty-row">Henüz gelir yok</div>'}
      </div>
    </div>

    <div class="card">
      <div class="card-title">Son Kayıt Olan Kullanıcılar <span>${profiles.length} toplam</span></div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>Firma Adı</th><th>Email</th><th>Rol</th><th>Tip</th><th>Konum</th><th>Kayıt Tarihi</th>
          </tr></thead>
          <tbody>
            ${sonKayitlar.map(p=>`<tr>
              <td>${p.firma_adi||p.name||'—'}</td>
              <td style="color:var(--ink3)">${p.email||'—'}</td>
              <td><span class="badge ${p.role==='marka'?'badge-marka':'badge-uretici'}">${p.role==='marka'?'Marka':'Hizmet'}</span></td>
              <td style="color:var(--ink3)">${hl(p.hizmet_tipi||p.role)}</td>
              <td style="color:var(--ink3)">${p.konum||'—'}</td>
              <td style="color:var(--ink3)">${fmtD(p.createdAt)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;

    document.getElementById('last-updated').textContent='Son güncelleme: '+new Date().toLocaleTimeString('tr-TR');
  }catch(e){
    el.innerHTML='<div style="text-align:center;padding:40px;color:var(--red)">Hata: '+e.message+'</div>';
    console.error(e);
  }
  spin.style.display='none';
}

async function boot(){
  let tries=0;
  while(!window._fb&&tries<30){await new Promise(r=>setTimeout(r,200));tries++;}
  if(!window._fb){document.getElementById('err').textContent='Firebase yüklenemedi';return;}
  const fb=getFB();
  fb.onAuthStateChanged(fb.auth,async user=>{
    if(user){
      if(user.email!==ADMIN_EMAIL){
        await fb.signOut(fb.auth);
        document.getElementById('err').textContent='Bu panele erişim yetkiniz yok';
        return;
      }
      document.getElementById('v-login').style.display='none';
      document.getElementById('v-admin').style.display='block';
      document.getElementById('admin-user').textContent=user.email;
      await loadData();
    } else {
      document.getElementById('v-login').style.display='flex';
      document.getElementById('v-admin').style.display='none';
    }
  });
}
boot();
</script>
</body>
</html>
